name: Release

# Uma tag v<versão> (ex.: v0.7.2) publica a release com o .xpi. Ver "Publicar uma versão" no README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    name: Publicar o .xpi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Conferir a tag com a versão do manifest.json
        run: |
          versao=$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")
          if [ "$GITHUB_REF_NAME" != "v$versao" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não bate com a versão $versao do manifest.json."
            exit 1
          fi
          echo "VERSAO=$versao" >> "$GITHUB_ENV"
      - name: Conferir as traduções
        run: python tools/check_i18n.py
      - name: Gerar o .xpi
        run: python tools/build.py
      - name: Montar as notas (seção da versão no CHANGELOG.md)
        run: |
          xpi="dist/faixa-$VERSAO.xpi"
          awk -v v="## $VERSAO" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notas.md
          if ! grep -q '[^[:space:]]' notas.md; then
            echo "::error::O CHANGELOG.md não tem a seção ## $VERSAO."
            exit 1
          fi
          {
            echo
            echo "### Instalar"
            echo
            echo "Baixe \`faixa-$VERSAO.xpi\` abaixo. No Thunderbird: **Ferramentas → Extensões e temas** → engrenagem → **Instalar extensão a partir de arquivo…**. Na frota, por política: ver o [README](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md#na-frota-por-política)."
            echo
            echo "SHA-256 do pacote: \`$(sha256sum "$xpi" | cut -d' ' -f1)\`"
          } >> notas.md
          cat notas.md
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" "dist/faixa-$VERSAO.xpi" --title "Faixa de Opções $VERSAO" --notes-file notas.md --verify-tag
